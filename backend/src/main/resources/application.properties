spring.application.name=backend

# Database Configuration
# para produccion usar mejor docker sevrets 
# para almacenar las variables de entornos
spring.datasource.url=jdbc:postgresql://postgres:5432/trainhub_dev_db
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dev_user
spring.datasource.password=dev_pass
spring.datasource.driver-class-name=org.postgresql.Driver
#  para que se generen las tablas automaticamente al levantar la app
spring.jpa.hibernate.ddl-auto: update

# Server Configuration
server.port=8081

# JWT Configuration
# Clave secreta para firmar tokens (en producción debe ser más segura y estar en variables de entorno)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tiempo de expiración en milisegundos (24 horas = 86400000 ms)
jwt.expiration=86400000
