spring.application.name=backend

# Configuración de Base de Datos PostgreSQL
    # la base de datos que creamos en el docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5431/trainhub_dev_db
spring.datasource.username=dev_user
spring.datasource.password=dev_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Configuración de logging a archivo
# logging.file.name=logs/application.log
# O usar logging.file.path para especificar solo el directorio
# logging.file.path=logs
spring.output.ansi.enabled=always

# Configuración JWT
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS512Algorithm
jwt.expiration=86400000

# Configuración de Spring Mail
# URL base de la aplicación para construir enlaces en los emails
# Para desarrollo local
app.base-url=http://localhost:8080
# URL base del frontend para enlaces que debe abrir el usuario
app.frontend-url=http://localhost:4200
# # Para producción
# app.base-url=https://api.tu-dominio.com
# # O si el backend está en un subdominio diferente
# app.base-url=https://backend.tu-dominio.com

# Configuración SMTP - Gmail (ejemplo)
# Para usar Gmail, necesitas generar una "Contraseña de aplicación" desde tu cuenta de Google
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu-email@gmail.com
# spring.mail.password=tu-contraseña-de-aplicación
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración SMTP - Servidor genérico (descomenta y configura según tu proveedor)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Primero busca la variable de entorno MAIL_USERNAME, Si no existe, usa el valor por defecto tu-email@gmail.com
spring.mail.username=${MAIL_USERNAME:93adones@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
# spring.mail.password=swgx yyqg ywnw qvyg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000