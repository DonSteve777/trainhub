<div class="trainhub-logo" [ngClass]="logoClasses">
  <div class="logo-icon">
    <!-- Anillo exterior azul segmentado -->
    <div class="outer-ring">
      <div class="ring-segment segment-1"></div>
      <div class="ring-segment segment-2"></div>
      <div class="ring-segment segment-3"></div>
      <div class="ring-segment segment-4"></div>
    </div>
    
    <!-- Anillo naranja -->
    <div class="middle-ring"></div>
    
    <!-- Círculo interno -->
    <div class="inner-circle">
      <!-- Mancuerna izquierda -->
      <div class="dumbbell left">
        <div class="weight"></div>
        <div class="bar"></div>
        <div class="weight"></div>
      </div>
      
      <!-- Letra M con flecha de progreso -->
      <div class="letter-m">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Letra M -->
          <path d="M 20 75 L 20 35 L 35 60 L 50 35 L 65 60 L 80 35 L 80 75 L 70 75 L 70 50 L 50 75 L 30 50 L 30 75 Z" 
                fill="var(--trainhub-accent)" />
          
          <!-- Flecha de crecimiento -->
          <path d="M 35 45 L 50 30 L 65 45" 
                stroke="var(--trainhub-info)" 
                stroke-width="4" 
                fill="none" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
          <path d="M 50 30 L 50 55" 
                stroke="var(--trainhub-info)" 
                stroke-width="4" 
                stroke-linecap="round"/>
          <!-- Punta de flecha -->
          <polygon points="50,20 45,28 55,28" 
                   fill="var(--trainhub-info)"/>
        </svg>
      </div>
      
      <!-- Mancuerna derecha -->
      <div class="dumbbell right">
        <div class="weight"></div>
        <div class="bar"></div>
        <div class="weight"></div>
      </div>
    </div>
  </div>
  
  <!-- Texto del logo -->
  <div class="logo-text">
    <div class="main-title">
      <span class="train">TRAIN</span><span class="hub">HUB</span>
    </div>
    <div class="subtitle">HYROX STATS & COMMUNITY</div>
  </div>
</div>
