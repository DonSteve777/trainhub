<div class="chart-wrapper">
  <div class="chart-header">
    <span class="chart-label" [style.color]="color">{{ label }}</span>
    <div class="chart-stats">
      <span class="chart-time" [style.color]="color">{{ formatTime(athleteTime) }}</span>
      <span class="chart-percentile">&nbsp;top {{ athletePercentile }}%</span>
    </div>
  </div>
  <div class="chart-canvas-wrapper">
    <canvas baseChart [data]="chartData" [options]="chartOptions" type="line"></canvas>
  </div>
</div>
