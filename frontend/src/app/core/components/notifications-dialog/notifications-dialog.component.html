<div class="notif-dialog">

  <div class="notif-header">
    <span class="notif-header__title">Notificaciones</span>
    <button class="notif-header__close" (click)="close()" aria-label="Cerrar notificaciones">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="notif-list">

    @if (loading()) {
      <div class="notif-empty">
        <div class="notif-loading">
          <span class="notif-loading__dot"></span>
          <span class="notif-loading__dot"></span>
          <span class="notif-loading__dot"></span>
        </div>
      </div>
    } @else if (error()) {
      <div class="notif-empty">
        <mat-icon class="notif-empty__icon">error_outline</mat-icon>
        <p>{{ error() }}</p>
      </div>
    } @else if (notifications().length === 0) {
      <div class="notif-empty">
        <mat-icon class="notif-empty__icon">notifications_none</mat-icon>
        <p>No tienes notificaciones todavía.</p>
      </div>
    } @else {
      @for (n of notifications(); track n.type + '-' + n.postId) {
        <button
          class="notif-item"
          [class.notif-item--unread]="n.unread"
          (click)="onItemClick(n)"
        >
          <div class="notif-item__avatar-wrap">
            <img
              class="notif-item__avatar"
              [src]="avatarUrl(n.lastActorPhotoUrl, n.lastActorUsername)"
              [alt]="n.lastActorUsername"
            />
            <span class="notif-item__type-icon" [class.notif-item__type-icon--comment]="n.type === 'COMMENT'">
              <mat-icon>{{ iconForType(n.type) }}</mat-icon>
            </span>
          </div>
          <div class="notif-item__body">
            <p class="notif-item__text">
              <strong>{{ n.lastActorUsername }}</strong>
              {{ buildText(n) }}
            </p>
            <span class="notif-item__time">{{ formatDate(n.lastActionAt) }}</span>
          </div>
          @if (n.unread) {
            <span class="notif-item__dot" aria-hidden="true"></span>
          }
        </button>
      }
    }

  </div>

</div>
