@if (panel === 'left') {
  <div class="sidebar-panel sidebar-panel--left">
    <div class="logo-container" routerLink="/feed">
      <img src="images/logotipo.png" alt="Logo" class="logo" />
    </div>
  </div>
}

@if (panel === 'right') {
  <div class="sidebar-panel sidebar-panel--right">
    <button
      type="button"
      class="create-button"
      mat-raised-button
      color="tertiary"
      (click)="goToCreatePost()"
      [disabled]="isOnCreatePost()"
      aria-label="Crear publicación"
    >
      <mat-icon>add</mat-icon>
    </button>
    <button
      type="button"
      class="notif-button"
      mat-icon-button
      aria-label="Notificaciones"
      (click)="openNotifications()"
    >
      <mat-icon>notifications</mat-icon>
      @if (unreadCount() > 0) {
        <span class="notif-badge">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</span>
      }
    </button>
    <button type="button" class="chat-button" mat-icon-button color="tertiary" aria-label="Abrir chat">
      <mat-icon>chat_bubble</mat-icon>
    </button>
    <button type="button" class="profile-button" mat-icon-button aria-label="Mi perfil">
      <mat-icon>account_circle</mat-icon>
    </button>
    <button type="button" class="logout-button" mat-icon-button aria-label="Cerrar sesión" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
}
