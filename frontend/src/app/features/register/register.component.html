<div class="register-container">
  <div class="register-card">
    <app-trainhub-logo class="logo"></app-trainhub-logo>

    <h1>Crea tu cuenta</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <!-- Email -->
      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.error]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        />
        <span class="error-message" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          [class.error]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        />
        <span class="error-message" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </span>
      </div>

      <!-- Foto -->
      <div class="form-group">
        <label for="photo">Foto de perfil</label>
        <input
          id="photo"
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="registerForm.invalid"
      >
        Crear cuenta
      </button>
    </form>
  </div>
</div>
