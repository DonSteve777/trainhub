<div class="home-container">
  <!-- Mitad izquierda - Logo -->
  <div class="left-section">
    <app-trainhub-logo size="large"></app-trainhub-logo>
  </div>
  
  <!-- Mitad derecha - Contenido -->
  <div class="right-section">
    <h1>Bienvenido a TrainHub</h1>
    <p>Tu plataforma definitiva para estadísticas Hyrox y comunidad de entrenamiento</p>
    
    <!-- Formulario de inicio de sesión -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          placeholder="tu@email.com"
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="Contraseña"
          class="form-control"
        />
      </div>
      
      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>
      
      <a href="#" class="forgot-password">¿Has olvidado la contraseña?</a>
      
      <div class="divider">
        <span>o</span>
      </div>
      
      <button type="button" class="btn-register" id="register-button-home" routerLink="/verify-email">
        Registrarse
      </button>
    </form>
  </div>
</div>
