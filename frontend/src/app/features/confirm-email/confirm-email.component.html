<div class="confirm-email-container">
  <div class="card">
    <h1>Confirmación de Email</h1>

    <!-- Mostrar el token -->
    <div class="section">
      <h2>Token recibido:</h2>
      <div class="token-box">
        <code>{{ token || 'No se encontró token' }}</code>
      </div>
    </div>

    <!-- Estado de carga -->
    <div class="section" *ngIf="loading">
      <p class="loading">Validando token...</p>
    </div>

    <!-- Mostrar error -->
    <div class="section" *ngIf="error">
      <h2>Error:</h2>
      <div class="error-box">
        <p>{{ error }}</p>
      </div>
    </div>

    <!-- Mostrar respuesta del backend -->
    <div class="section" *ngIf="apiResponse && !loading">
      <h2>Respuesta del backend:</h2>
      <div class="response-box">
        <pre>{{ apiResponse | json }}</pre>
      </div>
    </div>
  </div>
</div>
