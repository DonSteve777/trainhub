<div class="confirm-email-container">
  <div class="card">
    <h1>Confirmación de Email</h1>

    <!-- Estado de carga -->
    <div class="section" *ngIf="loading">
      <p class="loading">Validando token...</p>
    </div>

    <!-- Mostrar error -->
    <div class="section" *ngIf="error">
      <h2>Error:</h2>
      <div class="error-box">
        <p>{{ error }}</p>
      </div>
    </div>

    <!-- Mostrar respuesta del backend, depuracion -->
    <!-- <div class="section" *ngIf="apiResponse && !loading">
      <h2>Respuesta del backend:</h2>
      <div class="response-box">
        <pre>{{ apiResponse | json }}</pre>
      </div>
    </div> -->

    <!-- Mensaje de éxito -->
    <div class="section" *ngIf="apiResponse && !error && !loading">
      <div class="success-box">
        <p>¡Email confirmado exitosamente! Ya puedes acceder a tu cuenta.</p>
      </div>
    </div>

    <!-- Botón para ir a home -->
    <div class="button-section">
      <button 
        class="continue-button" 
        [disabled]="loading"
        (click)="goToHome()"
        id="continue-button">
        {{ loading ? 'Validando...' : 'Volver al inicio' }}
      </button>
    </div>
  </div>
</div>
