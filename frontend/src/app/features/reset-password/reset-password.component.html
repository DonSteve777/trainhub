<div class="container">
  <div class="left">
    <app-trainhub-logo size="large"></app-trainhub-logo>
  </div>

  <div class="right">
    <h1>Nueva contraseña</h1>
    <p>Elige una contraseña nueva (mínimo 8 caracteres).</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          placeholder="Nueva contraseña"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirmar contraseña"
          class="form-control"
        />
        <small *ngIf="form.get('confirmPassword')?.errors?.['passwordMismatch']">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        Restablecer contraseña
      </button>

      <p *ngIf="message" class="message success">{{ message }}</p>
      <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>

      <a routerLink="/" class="btn-link">Volver al inicio</a>
    </form>
  </div>
</div>
