<div class="th-split-page">
  <div class="th-split-left">
    <app-trainhub-logo size="large"></app-trainhub-logo>
  </div>

  <div class="th-split-right">
    <h1 class="th-title-gradient">Recuperar contraseña</h1>
    <p class="th-lead">Introduce tu email y te enviaremos un enlace para restablecerla.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="th-form">
      <div class="th-form-group">
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="th-input"
        />
      </div>

      <button type="submit" class="th-btn-primary" [disabled]="isSubmitting">
        Enviar enlace
      </button>

      @if (message) {
        <p class="th-message th-message--success">{{ message }}</p>
      }
      @if (errorMessage) {
        <p class="th-message th-message--error">{{ errorMessage }}</p>
      }

      <a routerLink="/" class="th-link-info">Volver al inicio</a>
    </form>
  </div>
</div>
