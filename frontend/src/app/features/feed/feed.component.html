<div class="feed" #feedContainer>
  @for (post of posts(); track post.id) {
    <article class="post-card">
      <div class="post-card__rail">
        <a class="post-avatar" [routerLink]="['/user', post.userId]">
          <img [src]="post.avatarUrl" [alt]="post.username + ' avatar'" />
        </a>
        <span class="post-type-badge" [attr.data-type]="post.postType">{{
          typeLabel(post.postType)
        }}</span>
      </div>

      <div class="post-card__main">
        <div class="post-username-row">
          <a class="post-username" [routerLink]="['/user', post.userId]">{{ post.username }}</a>
          @if (post.mateUsername) {
            <span class="post-mate-separator">&amp;</span>
            <a
              class="post-username post-username--mate"
              [routerLink]="['/user', post.mateUserId]"
              >{{ post.mateUsername }}</a
            >
          }
          <time class="post-date" [attr.datetime]="post.creationDate">{{
            formatPostDate(post.creationDate)
          }}</time>
        </div>
        <app-post-content [post]="post" />
      </div>

      <div class="post-card__aside">
        <div class="post-actions">
          <button
            type="button"
            class="action-btn"
            (click)="toggleLike(post)"
            [attr.aria-label]="'Me gusta, ' + post.likes + (post.likes === 1 ? ' voto' : ' votos')"
          >
            <mat-icon [class.action-btn__icon--liked]="post.liked">
              {{ post.liked ? 'favorite' : 'favorite_border' }}
            </mat-icon>
            <span class="action-count" aria-hidden="true">{{ post.likes }}</span>
          </button>

          <button
            type="button"
            class="action-btn"
            (click)="openComments(post)"
            [attr.aria-label]="
              'Comentarios, ' +
              post.commentsCount +
              (post.commentsCount === 1 ? ' comentario' : ' comentarios')
            "
          >
            <mat-icon>chat_bubble_outline</mat-icon>
            <span class="action-count" aria-hidden="true">{{ post.commentsCount }}</span>
          </button>
        </div>

        @if (post.postType === 'BOX_CHALLENGE') {
          <button
            type="button"
            class="join-btn"
            [class.join-btn--joined]="post.joinedByCurrentUser"
            (click)="toggleJoin(post)"
            [attr.aria-pressed]="post.joinedByCurrentUser"
          >
            <mat-icon aria-hidden="true">{{
              post.joinedByCurrentUser ? 'check_circle' : 'add_circle_outline'
            }}</mat-icon>
            <span class="join-btn__label">{{
              post.joinedByCurrentUser ? 'Me borro' : 'Me apunto'
            }}</span>
            <span class="join-btn__count">{{ participantsLabel(post.participantsCount) }}</span>
          </button>
        }
      </div>
    </article>
  }

  @if (loading()) {
    <div class="feed-loading" aria-live="polite" aria-label="Cargando más publicaciones">
      <span class="feed-loading__dot"></span>
      <span class="feed-loading__dot"></span>
      <span class="feed-loading__dot"></span>
    </div>
  }

  <div #sentinel class="feed-sentinel"></div>
</div>
