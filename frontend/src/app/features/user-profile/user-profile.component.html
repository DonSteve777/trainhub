<div class="user-profile-container">
  <div class="profile-card">
    <h1>Mi Perfil</h1>

    @if (isLoading()) {
      <div class="loading-state">Cargando perfil...</div>
    } @else {
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
              <!-- Nombre -->
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Tu nombre"
          [class.error]="profileForm.get('name')?.touched && profileForm.get('name')?.invalid"
        />
        <!-- <span class="error-message" *ngIf="getFieldError('name')">
          {{ getFieldError('name') }}
        </span> -->
      </div>
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email *</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            [class.error]="profileForm.get('email')?.touched && profileForm.get('email')?.invalid"
          />
          @if (getFieldError('email')) {
            <span class="error-message">{{ getFieldError('email') }}</span>
          }
        </div>

        <!-- URL de la foto -->
        <div class="form-group">
          <label for="photoUrl">URL de la foto de perfil</label>
          <input
            id="photoUrl"
            type="url"
            formControlName="photoUrl"
            placeholder="https://ejemplo.com/foto.jpg"
            [class.error]="profileForm.get('photoUrl')?.touched && profileForm.get('photoUrl')?.invalid"
          />
          @if (getFieldError('photoUrl')) {
            <span class="error-message">{{ getFieldError('photoUrl') }}</span>
          }
        </div>

        <!-- Mensajes de éxito y error -->
        @if (successMessage()) {
          <div class="success-message">{{ successMessage() }}</div>
        }
        @if (errorMessage()) {
          <div class="error-message-box">{{ errorMessage() }}</div>
        }

        <!-- Botón de enviar -->
        <button
          type="submit"
          class="submit-button"
          [disabled]="isSubmitting() || profileForm.invalid"
        >
          @if (isSubmitting()) {
            <span>Guardando...</span>
          } @else {
            <span>Guardar cambios</span>
          }
        </button>
      </form>
    }
  </div>
</div>
